- type: entity
  parent: WeaponPistolAnaconda
  id: WeaponPistolHawk4
  name: LWC HAWK-4 I.S
  description: A modified, heavy Anaconda for the purpose of assassinating high value targets. This rare prototype is capable of printing armor penetrating bullets. A laser and holographic sight alongside a matte black chassis with a custom-built integrated silencer make for an exceedingly deadly stealth weapon.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Pistols/hawk4.rsi
    layers:
    - state: icon
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Pistols/hawk4.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Gun
    fireRate: 2
    projectileSpeed: 65
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/hawk_fire.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletHawk
    capacity: 7
    count: 7
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 5
    rechargeSound:
      path: /Audio/Weapons/Guns/Cock/shotgun_close.ogg
  - type: AmmoCounter
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Wieldable
  - type: LaserPointer
  - type: Tag
    tags:
    - Sidearm

- type: entity
  id: BulletHawk
  name: bullet (7x30mm caseless)
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 60
    armorPenetration: 0.4

- type: entity
  parent: WeaponPistolAnaconda
  id: WeaponRevolverDragoon
  name: TPC Dragoon officer's revolver
  description: A heavy revolver, chambered in a replicating .500 magnum round. The Dragoon is a custom made revolver for the Grand Vizier of the PDV, meant to be a commanding presence in the hands of an experienced marshall.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Pistols/vizier-revolver.rsi
    layers:
    - state: icon
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Gun
    fireRate: 1.5
    projectileSpeed: 75
    burstCooldown: 0.75
    burstFireRate: 12
    shotsPerBurst: 2
    selectedMode: SemiAuto
    minAngle: 1
    maxAngle: 8
    availableModes:
    - SemiAuto
    - Burst
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletDragoon
    capacity: 12
    count: 12
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1.5
    rechargeSound:
      path: /Audio/Weapons/Guns/Cock/shotgun_close.ogg
  - type: AmmoCounter
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Tag
    tags:
    - Sidearm
    - Dragoon

- type: entity
  id: BulletDragoon
  name: bullet (.500 magnum caseless)
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 50
    armorPenetration: 0.20

# Evil Fucking TSF Sniper Rifle That Kills Yumiko White

- type: entity
  name: "TCA AJS-95 'Absolver' Sniper Rifle"
  parent: [BaseGunWieldable, BaseC2ContrabandUnredeemable]
  id: WeaponTSFAbsolver
  description: A self-loading rifle built with the same technology as the anaconda. Fires hypodermic needle-like projectile or solid sabot at high velocity. The existence of this rifle was an open secret by the TSF Military due to the increased death caused by razorium poisoning.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Snipers/shenzhen.rsi    layers:
    - state: icon
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Gun
    fireRate: 2
    projectileSpeed: 100
    selectedMode: SemiAuto
    minAngle: 1
    maxAngle: 8
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: ProjectileBatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 1000
  - type: EnergyGun
    fireModes:
    - proto: BulletDisabler
      fireCost: 700
      name: disable
      state: disabler
    - proto: BulletEnergyGun357_magnum
      fireCost: 700
      name: lethal
      state: lethal
  - type: GunRequiresWield
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 350
    autoRechargePause: true
    autoRechargePauseTime: 5
