- type: entity
  name: spectre's blade
  parent: BaseKnife
  id: SpectresBlade
  description: "A modified blade from the old corporate wars with a internal reservoir for any chemical an aspiring agent would dream of, however, due to this, the blade has a longer recharge timer."
  components:

  - type: Sprite
    sprite: _White/Objects/Weapons/Melee/Daggers/betrayal_knife.rsi
    state: icon
  - type: Item
    size: Small


  - type: MeleeWeapon
    angle: 0
    wideAnimationRotation: 180
    attackRate: 1.5
    damage:
      types:
        Slash: 8            
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg


  - type: Sharp
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: ThrowingAngle
    angle: 180
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 10
  - type: DisarmMalus
    malus: 0.225


  - type: StaminaDamageOnHit
    damage: 35
    sound: /Audio/Weapons/egloves.ogg


  - type: SolutionContainerManager
    solutions:
      melee:
        maxVol: 10
        reagents:
        - ReagentId: Razorium
          Quantity: 10
  - type: MeleeChemicalInjector
    solution: melee
    transferAmount: 5
    transferEfficiency: 1
    pierceArmor: true            
  - type: RefillableSolution
    solution: melee
  - type: InjectableSolution
    solution: melee
  - type: DrawableSolution
    solution: melee


  - type: BackStab


  - type: Blink
  - type: UseDelay
    delay: 5
    delays:
      blink:
        length: 3
  - type: UseDelayBlockMelee
